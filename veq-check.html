<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D5A27">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>เช็คก่อนออกรถ — SSB</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   veq-check · เช็คก่อนออกรถ "ทุกวัน" — ฉบับใช้งานจริง (12 พ.ย. 2569)
   โทนเดียวกับ Driver_form (เขียว --g1/--g2 + Sarabun + พื้น #F5F5F0)
   ขยายสำหรับคนขับข้างรถกลางแดด: ตัว 17px+, ปุ่ม ≥56px, ตัวหนังสือรองเข้มขึ้น · โหมดสว่างอย่างเดียว
   ============================================================ */
:root{
  color-scheme:light;
  --g1:#2D5A27;--g2:#4A7C3F;--g3:#D6E8D0;--g4:#F0F7EE;
  --b1:#7B4F2E;--b3:#F5E6D0;--s1:#1E40AF;--s3:#DBEAFE;
  --ok:#15803D;--ok-l:#DCFCE7;
  --warn:#B45309;--warn-l:#FEF3C7;
  --bad:#B91C1C;--bad-l:#FEE2E2;
  --info:#1E40AF;--info-l:#DBEAFE;
  --text:#1F2937;--text-m:#4B5563;--text-l:#6B7280;
  --line:#E5E7EB;--white:#FFFFFF;--bg:#F5F5F0;
  --shadow:0 2px 8px rgba(0,0,0,.07);
  --tap:56px;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sarabun',-apple-system,'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.55;min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.hide{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 130px}
.req{color:var(--bad);font-weight:700}

/* header */
.hdr{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hdr-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:60px}
.hdr-back{width:48px;height:48px;border-radius:12px;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);flex-shrink:0}
.hdr-ic{font-size:30px;line-height:1}
.hdr-t{font-size:19px;font-weight:700;line-height:1.25}
.hdr-s{font-size:13px;color:var(--g3)}
.prog{max-width:560px;margin:0 auto;padding:0 12px 10px;display:flex;align-items:center;gap:10px}
.prog-txt{font-size:16px;white-space:nowrap}
.prog-txt b{font-size:22px}
.prog-bar{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.prog-bar i{display:block;height:100%;background:#FDE68A;border-radius:99px;transition:width .3s}
.prog-bar i.full{background:#86EFAC}
.prog-next{height:40px;padding:0 12px;border-radius:20px;background:#fff;color:var(--g1);font-weight:700;font-size:15px;white-space:nowrap}
.offline{background:var(--warn);color:#fff;text-align:center;font-weight:600;font-size:15px;padding:8px 12px}
.stale{background:var(--warn-l);color:var(--warn);text-align:center;font-size:14px;padding:6px 12px}

/* cards */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.h3{font-size:18px;font-weight:700;margin:20px 4px 10px}
.muted{color:var(--text-m)}
.small{font-size:15px}
.veh-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp{font-size:15px;font-weight:700;padding:4px 12px;border-radius:20px}
.g-ไร่{background:var(--g3);color:var(--g1)}
.g-Bulk{background:var(--s3);color:var(--s1)}
.g-Packing{background:var(--b3);color:var(--b1)}
.veh-type{font-size:15px;color:var(--text-m)}
.plates{display:flex;gap:10px;margin:10px 0 8px}
.plate{flex:1;border:2.5px solid var(--text);border-radius:10px;padding:2px 8px 4px;text-align:center;background:#fff}
.plate small{display:block;font-size:13px;color:var(--text-m);line-height:1.2}
.plate b{font-size:24px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.veh-drv{font-size:17px}
.spare{margin-top:10px;background:#F3F4F6;border-radius:10px;padding:8px 12px;font-size:15px;color:var(--text-m)}

.mc{border-left:6px solid var(--line)}
.mc.st-todo{border-left-color:var(--g2)}
.mc.st-departed{border-left-color:var(--warn)}
.mc.st-norun{border-left-color:var(--text-l)}
.mc.st-ontime,.mc.st-reviewed{border-left-color:var(--ok)}
.mc.st-late{border-left-color:#CA8A04}
.mc.st-ret{border-left-color:var(--bad)}
.mc-lbl{font-size:15px;color:var(--text-m)}
.mc-day{font-size:24px;font-weight:700;line-height:1.25}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:700;padding:6px 14px;border-radius:99px;margin:10px 0 6px}
.p-todo{background:#F3F4F6;color:#374151}
.p-ok{background:var(--ok-l);color:var(--ok)}
.p-late{background:#FEF9C3;color:#854D0E}
.p-bad{background:var(--bad-l);color:var(--bad)}
.p-warn{background:var(--warn-l);color:var(--warn)}
.reason{background:var(--bad-l);border-radius:12px;padding:12px 14px;margin:8px 0;color:#7F1D1D;font-size:17px}
.reason b{display:block;font-size:15px;color:var(--bad)}
.note-box{border-radius:12px;padding:10px 14px;margin:8px 0;font-size:16px;font-weight:600}
.nb-warn{background:var(--warn-l);color:var(--warn)}
.nb-info{background:var(--info-l);color:var(--info)}
.nb-ok{background:var(--ok-l);color:var(--ok)}

/* buttons */
.btn-main{width:100%;min-height:60px;border-radius:14px;background:var(--g1);color:#fff;font-size:20px;font-weight:700;margin-top:12px;box-shadow:0 3px 10px rgba(45,90,39,.3);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn-main:disabled{background:#9CA3AF;box-shadow:none}
.btn-main.todo{background:#fff;color:var(--warn);border:2.5px solid var(--warn);box-shadow:none}
.btn-sec{width:100%;min-height:var(--tap);border-radius:14px;background:#fff;border:2px solid var(--g2);color:var(--g1);font-size:18px;font-weight:700;margin-top:10px;padding:0 14px}
.btn-plain{width:100%;min-height:52px;border-radius:14px;background:transparent;color:var(--text-m);font-size:17px;font-weight:600;margin-top:6px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(245,245,240,.96);border-top:1px solid var(--line);padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
.bottom-in{max-width:560px;margin:0 auto}
.bottom .btn-main{margin-top:4px}
.saved{font-size:13px;color:var(--text-l);text-align:center}

/* 14-day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:#fff;border-radius:10px;box-shadow:var(--shadow);min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;border:2px solid transparent}
.day small{font-size:12px;color:var(--text-m);line-height:1.2}
.day b{font-size:16px;line-height:1.2;font-variant-numeric:tabular-nums}
.day i{font-style:normal;font-size:20px;line-height:1.2}
.day.d-miss{border-color:#FCA5A5;background:#FFF7F7}
.day.d-late{border-color:#FDE68A}
.day.d-warn{border-color:#FCD34D}
.day.d-idle,.day.d-none{opacity:.6;box-shadow:none;background:#F3F4F6}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--text-m);margin:8px 4px 0}
.stat{display:flex;gap:10px;margin-bottom:10px}
.stat div{flex:1;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--text-m)}

/* check screen */
.sec{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;margin:18px 4px 10px}
.stepn{width:34px;height:34px;border-radius:50%;background:var(--g1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sec .ok-mark{margin-left:auto;font-size:15px;color:var(--ok);background:var(--ok-l);border-radius:99px;padding:2px 10px}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:relative;min-height:128px;border-radius:14px;border:2.5px dashed var(--g2);background:var(--g4);color:var(--g1);font-size:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;line-height:1.3;overflow:hidden}
.ov.need{border-color:var(--bad);background:#FFF5F5;color:var(--bad)}
.ov span.ic{font-size:34px}
.ov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov .ov-cap{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;font-size:14px;padding:4px 6px}
.ov-hint{font-size:14px;color:var(--text-m);margin-top:8px}
.odo-inp{width:100%;height:64px;border:2.5px solid #D1D5DB;border-radius:14px;padding:0 16px;font-family:inherit;font-size:30px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;color:var(--text);background:#fff;outline:none}
.odo-inp:focus{border-color:var(--g2);box-shadow:0 0 0 4px rgba(74,124,63,.2)}
.odo-fmt{font-size:16px;color:var(--text-m);margin-top:6px}
.odo-warn{background:var(--warn-l);color:var(--warn);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:15px;font-weight:600}
.adm{background:var(--bad-l);border-left:5px solid var(--bad);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:16px;color:#7F1D1D}
.adm b{color:var(--bad)}
.btn-all{width:100%;min-height:68px;border-radius:16px;background:var(--ok);color:#fff;font-size:21px;font-weight:700;margin-bottom:6px;padding:0 12px;box-shadow:0 3px 10px rgba(21,128,61,.3)}
.all-hint{font-size:15px;color:var(--text-m);text-align:center;margin-bottom:6px}

.cat-hd{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 8px}
.cat-t{font-size:18px;font-weight:700}
.cat-n{font-size:15px;font-weight:700;color:var(--text-m);background:#fff;border-radius:99px;padding:2px 12px}
.cat-n.full{background:var(--ok-l);color:var(--ok)}

.item{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:8px;border:2px solid transparent;overflow:hidden;scroll-margin-top:140px}
.item.is-ok{border-color:#BBF7D0;background:#FAFFFB}
.item.is-warn{border-color:#FCD34D;background:#FFFDF5}
.item.is-bad{border-color:#FCA5A5;background:#FFFAFA}
.item.is-pending{border-color:#FCD34D}
.item.flag{border-color:var(--bad);box-shadow:0 0 0 3px rgba(185,28,28,.15)}
.it-hd{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;min-height:64px}
.it-ic{width:48px;height:48px;border-radius:12px;background:var(--g4);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.it-main{flex:1;min-width:0}
.it-name{font-size:19px;font-weight:700;line-height:1.3}
.it-sub{font-size:15px;color:var(--text-m);line-height:1.4}
.it-sub .exp-bad{color:var(--bad);font-weight:700}
.fm-no{font-size:22px;font-weight:800;color:var(--g1)}
.item.compact .fm-no{font-size:17px}
.it-sub .fm-star{color:var(--bad);font-weight:700}
.it-sub .fm-parts{margin-top:3px;color:var(--ink,#1f2a24);font-size:14.5px;line-height:1.45}
.it-sub .fm-parts b{color:var(--g1,#1B4332)}
.fm-stop{background:var(--bad-l);color:var(--bad);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:700;font-size:15px}
.it-age{display:block;font-size:14px;color:var(--text-l)}
.gauge-ref{display:flex;align-items:center;gap:12px;background:var(--g4);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:15px;line-height:1.45}
.gauge-ref svg{flex-shrink:0}
.gauge-ref b{color:var(--ok);font-size:16px}
.evi{scroll-margin-bottom:130px;scroll-margin-top:150px}
.it-qty{font-size:16px;font-weight:700;color:var(--g1);white-space:nowrap}
.item.compact .it-hd{min-height:52px;padding:6px 12px}
.item.compact .it-ic{width:36px;height:36px;font-size:22px;border-radius:10px}
.item.compact .it-name{font-size:17px}
.item.compact .it-sub{display:none}
.item.compact .badge{margin-top:0}
.item.compact .it-main{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:700;padding:3px 10px;border-radius:99px;margin-top:4px}
.t-ok{background:var(--ok-l);color:var(--ok)}
.t-warn{background:var(--warn-l);color:var(--warn)}
.t-bad{background:var(--bad-l);color:var(--bad)}
.t-pend{background:var(--warn-l);color:var(--warn)}
.it-edit{font-size:15px;font-weight:700;color:var(--g1);background:var(--g4);border-radius:10px;padding:0 12px;min-height:44px;display:flex;align-items:center;flex-shrink:0}
.it-body{padding:0 14px 14px}
.prev{background:#FFFBEB;border:1.5px solid #FCD34D;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:16px;display:flex;gap:10px;align-items:center}
.prev-tx{flex:1}
.prev-tx b{color:var(--warn)}
.prev img{width:52px;height:52px;border-radius:8px;object-fit:cover;cursor:zoom-in}
.btn-same{width:100%;min-height:var(--tap);border-radius:14px;background:var(--warn);color:#fff;font-size:18px;font-weight:700;margin-bottom:8px}

.quick{display:flex;gap:8px}
.btn-ok{flex:1.6;min-height:var(--tap);border-radius:14px;background:var(--ok);color:#fff;font-size:19px;font-weight:700;padding:0 10px}
.btn-prob{flex:1;min-height:var(--tap);border-radius:14px;background:#fff;border:2px solid var(--warn);color:var(--warn);font-size:16px;font-weight:700;padding:0 8px;line-height:1.2}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt-grid.c3{grid-template-columns:1fr 1fr 1fr}
.opt{min-height:64px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:17px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;line-height:1.2}
.opt span{font-size:24px}
.opt.on.o-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.on.o-warn{background:var(--warn);border-color:var(--warn);color:#fff}
.opt.on.o-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.score{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sc{min-height:var(--tap);border-radius:14px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sc.lo{color:var(--bad)}.sc.mid{color:var(--warn)}.sc.hi{color:var(--ok)}
.sc.on{color:#fff}.sc.on.lo{background:var(--bad);border-color:var(--bad)}.sc.on.mid{background:var(--warn);border-color:var(--warn)}.sc.on.hi{background:var(--ok);border-color:var(--ok)}
.sc-leg{display:flex;justify-content:space-between;font-size:14px;color:var(--text-m);margin-top:6px}
.ed-lbl{font-size:16px;font-weight:700;color:var(--text-m);margin:12px 0 6px}
.ed-lbl:first-child{margin-top:0}
.stepper{display:flex;align-items:center;gap:10px}
.st-btn{width:64px;height:64px;border-radius:16px;background:var(--g4);border:2px solid var(--g3);color:var(--g1);font-size:34px;font-weight:700;line-height:1}
.st-btn:disabled{opacity:.35}
.st-num{min-width:64px;text-align:center;font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.st-of{font-size:17px;color:var(--text-m)}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn-cam{width:100%;min-height:64px;border-radius:14px;border:2.5px dashed var(--g2);background:var(--g4);color:var(--g1);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-cam.need{border-color:var(--bad);background:#FFF5F5;color:var(--bad)}
.ph-row{display:flex;align-items:center;gap:12px}
.ph-th{width:84px;height:84px;border-radius:12px;object-fit:cover;border:2px solid var(--line);cursor:zoom-in;flex-shrink:0;background:#eee}
.ph-side{flex:1;min-width:0}
.ph-st{font-size:15px;color:var(--text-m);margin-bottom:6px}
.btn-re{min-height:48px;padding:0 16px;border-radius:12px;border:2px solid var(--g2);color:var(--g1);font-size:16px;font-weight:700;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:24px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:600;color:var(--text)}
.chip.on{background:var(--g1);border-color:var(--g1);color:#fff}
.note-inp{width:100%;min-height:52px;margin-top:8px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-family:inherit;font-size:17px;outline:none;background:#fff}
.note-inp:focus{border-color:var(--g2)}
.btn-fin{width:100%;min-height:var(--tap);margin-top:14px;border-radius:14px;background:var(--g1);color:#fff;font-size:19px;font-weight:700}
.btn-fin:disabled{background:#D1D5DB;color:#6B7280}
.need-txt{font-size:15px;color:var(--bad);font-weight:600;text-align:center;margin-top:6px}

/* summary / report */
.pc{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-bottom:10px;border-left:6px solid var(--line)}
.pc.t-warn{border-left-color:var(--warn);background:#fff}
.pc.t-bad{border-left-color:var(--bad);background:#fff}
.pc-ic{font-size:30px;line-height:1.1}
.pc-main{flex:1;min-width:0}
.pc-name{font-size:18px;font-weight:700}
.pc-lbl{font-size:16px;font-weight:700}
.pc.t-warn .pc-lbl{color:var(--warn)}.pc.t-bad .pc-lbl{color:var(--bad)}
.pc-note{font-size:16px;color:var(--text-m);margin-top:2px}
.pc-th{width:64px;height:64px;border-radius:10px;object-fit:cover;cursor:zoom-in}
.btn-mini{min-height:44px;padding:0 14px;border-radius:10px;background:var(--g4);color:var(--g1);font-weight:700;font-size:16px;align-self:center}
.kv{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv-k{font-size:16px;color:var(--text-m);flex:1}
.kv-v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.thumbs{display:flex;gap:8px}
details.oks{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px}
details.oks summary{list-style:none;min-height:56px;display:flex;align-items:center;padding:0 16px;font-size:18px;font-weight:700;color:var(--ok);cursor:pointer}
details.oks summary::-webkit-details-marker{display:none}
details.oks summary::after{content:'▾';margin-left:auto;color:var(--text-l)}
details.oks[open] summary::after{content:'▴'}
.ok-li{display:flex;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid var(--line);font-size:16px}
.ok-li b{margin-left:auto;color:var(--ok);font-size:15px;white-space:nowrap}

.state{text-align:center;padding:40px 20px}
.state-ic{font-size:84px;line-height:1.1}
.state-t{font-size:26px;font-weight:700;margin:12px 0 8px}
.state-p{font-size:18px;color:var(--text-m);line-height:1.6}

.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

#toastWrap{position:fixed;left:0;right:0;top:12px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}

.toast.ok{background:#14532D}.toast.warn{background:#92400E}.toast.error{background:#991B1B}
.toast .tx{flex:1;white-space:pre-line}
.toast .ta{min-height:40px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font-weight:700}

<script>
'use strict';
/* =====================================================================

const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return isoDate(d); };

const hm = iso => { if(!iso) return ''; const d=new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes())+' น.'; };
function fmtD(iso){ if(!iso) return ''; const d=new Date(iso); return d.getDate()+' '+TH_M[d.getMonth()]+' '+(d.getFullYear()+543); }
function fmtDT(iso){ return iso ? fmtD(iso)+' · '+hm(iso) : ''; }

function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }

  'FM-ก':{ic:'🚚',n:'ก. ตรวจทุกครั้งก่อนออกงาน'}, 'FM-ข':{ic:'🔗',n:'ข. เฉพาะหัวลาก / รถพ่วง'}, 'FM-ค':{ic:'📅',n:'ค. ตรวจประจำสัปดาห์ (วันจันทร์)'},

  HOSE_FILTER:['กรองปลายสายโหลด','Bulk โหลด','อัน','count','🧽'],
  FUEL_CAN:['กระป๋องเติมน้ำมัน','Bulk โหลด','ใบ','count','🛢️'],
  GLOVES:['ถุงมือ','PPE','คู่','count','🧤',{is_consumable:true}],
  HAIR_NET:['หมวกคลุมผม','PPE','ใบ','count','🧢',{is_consumable:true}],
  HARD_HAT:['หมวกเซฟตี้','PPE','ใบ','count','⛑️'],

// FM-TR-10: เลขข้อมาจาก fm_no (12 พ.ย. แทรกข้อ 10 กล้อง FM_CAM + ข้อ 11 เอกสาร FM_DOCS → code FM10–13 = ข้อ 12–15)
const fmNoOf = code => { const its=(S&&S.data&&S.data.items)||[]; const it=its.find(x=>x.item_code===String(code)); return it&&it.fm_no ? it.fm_no : (/^FM\d\d$/.test(String(code)) ? parseInt(String(code).slice(2),10) : null); };
const ICON = code => { const n=fmNoOf(code); return n ? '<span class="fm-no">'+n+'</span>' : (CATALOG[String(code).split('__')[0]]||[])[4] || '📦'; };
const CHIPS = {
  broken:['แตก / หัก','ใช้งานไม่ได้','จอดับ / ไม่ติด','รั่ว / ซึม','ส่งซ่อมแล้ว'],
  lost:['หายระหว่างทาง','ไม่เคยได้รับ','ใช้หมดแล้ว','อยู่ที่รถคันอื่น','แอดมินเก็บไว้'],

  fail:['ลมอ่อน / ยางแบน','ไฟไม่ติด','น้ำมันต่ำ','เติม / แก้แล้ว','แจ้งช่างแล้ว'],

};
const STATUS_OPTS = [['มี','🪪','มี (อยู่กับตัว)','ok'],['อยู่ที่รถ','🚚','อยู่ที่รถ','ok'],['ไม่มี','➖','ไม่มี','bad'],['หาย','❌','หาย','bad']];
const INST_OPTS   = [['ใช้ได้','❄️','ติดตั้ง ใช้ได้','ok'],['เสีย','🔧','ติดตั้ง แต่เสีย','warn'],['ไม่ได้ติดตั้ง','➖','ไม่มีติดตั้ง','bad']];
const PF_OPTS     = [['ผ่าน','👍','ผ่าน','ok'],['ไม่ผ่าน','👎','ไม่ผ่าน','bad']];

const FM_OTHER    = 'อื่นๆ';

const GAUGE_COND  = {green:'ปกติ',low:'ชำรุด',high:'ชำรุด',missing:'หาย'};

const GAUGE_SVG = '<svg viewBox="0 0 120 74" width="120" height="74" role="img" aria-label="เกจตัวอย่าง: เข็มต้องชี้ในโซนเขียวตรงกลาง">'+

const COND_OPTS   = [['ปกติ','👍','ปกติ','ok'],['ชำรุด','🔧','ชำรุด','warn'],['หาย','❌','หาย','bad']];

/* =====================================================================
   ตัวตน — ลิงก์ส่วนตัว (?t=) หรือ LINE LIFF
   ===================================================================== */
// อ่านพารามิเตอร์ทั้งจาก query ตรง และจาก liff.state (LIFF ห่อพารามิเตอร์ไว้ตอน redirect ครั้งแรก)
function qp(name){
  try{
    const q=new URLSearchParams(location.search); let v=q.get(name);
    const st=q.get('liff.state'); if(!v && st) v=new URLSearchParams(st.split('?')[1]||'').get(name);
    return v||null;
  }catch(e){ return null; }
}
function loadScript(src){
  return new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=()=>ok(); s.onerror=()=>bad(new Error('LIFF_SDK')); document.head.appendChild(s); });
}
const auth = {
  async getUser(){
    const t=qp('t');
    if(t) return {mode:'link', t};                       // ลิงก์ส่วนตัวรายวัน ไม่ต้องโหลด LIFF
    const liffId=qp('liff') || LIFF_ID_DEFAULT;
    if(!liffId) return null;
    try{
      if(!window.liff) await loadScript(LIFF_SDK);
      await liff.init({liffId});
      if(!liff.isLoggedIn()){
        if(liff.isInClient()){ liff.login(); return new Promise(()=>{}); }
        return null;                                      // เปิดนอก LINE และไม่ได้ล็อกอิน
      }
      const p=await liff.getProfile();
      return p && p.userId ? {mode:'liff', userId:p.userId, displayName:p.displayName} : null;
    }catch(e){ console.warn('LIFF', e && e.message); return null; }
  },
  close(){
    try{ if(window.liff && liff.isInClient && liff.isInClient()){ liff.closeWindow(); return; } }catch(e){}
    try{ window.close(); }catch(e){}
    toast('ปิดหน้านี้ได้เลย','info');
  }
};

const ident = () => S.user && S.user.mode==='link' ? {t:S.user.t} : {userId:S.user.userId};

/* =====================================================================
   api — Edge vehicle-equipment (ตาม agent2-backend/api-contract.md)
   GET  ?action=myDaily&(t|userId)&date            · GET ?action=myHistory&(t|userId)&vehicleId&from&to
   GET  ?action=checkDetail&(t|userId)&checkId
   POST {action:'uploadPhoto', t|userId, vehicleId, date, kind, itemCode, unitNo, imageBase64} → {ok,url,path}
   POST {action:'submitDaily', t|userId, vehicleId, date, odometer, odometer_photo, overview_photos[], note, client_draft_id, allOk, cleanliness, lines[]}
   error: LINK_EXPIRED · NOT_DRIVER · INACTIVE · NO_VEHICLE · NOT_YOUR_VEHICLE · PHOTO_REQUIRED(missing[],stale[]) · DAY_CLOSED · BAD_DATE · INVALID(errors[]) · NO_ITEMS
   ===================================================================== */
function offlineErr(){ const e=new Error('OFFLINE'); e.offline=true; return e; }
async function edgeFetch(url, opt, ms){
  if(!navigator.onLine) throw offlineErr();
  const ac=new AbortController(), tm=setTimeout(()=>ac.abort(), ms);
  let r;
  try{ r=await fetch(url, Object.assign({signal:ac.signal}, opt||{})); }
  catch(e){ const x=new Error(e && e.name==='AbortError' ? 'TIMEOUT' : 'NETWORK'); x.offline=true; throw x; }
  finally{ clearTimeout(tm); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!j) throw new Error('HTTP '+r.status);
  if(j.code==='LINK_EXPIRED') linkExpired();
  return j;
}
function edgeGet(params){
  const q=new URLSearchParams(Object.assign({}, params, ident()));
  return edgeFetch(VEQ_EDGE+'?'+q.toString(), null, GET_TIMEOUT_MS);
}
function edgePost(body){
  return edgeFetch(VEQ_EDGE, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({}, body, ident()))}, POST_TIMEOUT_MS);
}
const api = {
  getMyDaily:     ({date})                 => edgeGet({action:'myDaily', date}),   // vehicleId ว่าง = คันประจำ
  getMyHistory:   ({vehicleId, from, to})  => edgeGet({action:'myHistory', vehicleId, from, to}),
  getCheckDetail: ({checkId})              => edgeGet({action:'checkDetail', checkId}),
  uploadPhoto:    p                        => edgePost(Object.assign({action:'uploadPhoto'}, p)),
  submitDaily:    payload                  => edgePost(Object.assign({action:'submitDaily'}, payload)),
  pickList:       ({group})                => edgeGet({action:'pickList', group}),          // รถว่างวันนี้ (ตัดคันที่คนอื่นใช้แล้ว)
  pickVehicle:    ({vehicleId})            => edgePost({action:'pickVehicle', vehicleId}),   // วันนี้ขับคันนี้ (เฉพาะเช็คลิสต์ ไม่เกี่ยวค่าแรง)

const draftKey = () => 'ssb_veq_daily_v'+DRAFT_VER+'_'+S.uid+'_'+S.data.vehicle.id+'_'+S.date;
function emptyLine(){ return {found:null,cond:null,value:null,chips:[],text:'',photo:null,photoUp:null,admin:null,touched:true,open:false,same:false}; }
function splitNote(note, ln){
  if(!note) return;
  const all=[].concat(CHIPS.broken,CHIPS.lost,CHIPS.none,CHIPS.fail,CHIPS.gauge);
  String(note).split(' · ').forEach(p=>{ if(all.indexOf(p)>=0) ln.chips.push(p); else ln.text = ln.text ? ln.text+' · '+p : p; });
}
function lineFromSaved(it, l, forEdit){
  const ln=emptyLine(); if(!l) return ln;
  const m=it.check_mode;
  if(m==='count'){ ln.found=l.qty_found; ln.cond = l.condition==='ไม่มี' ? 'หาย' : (l.condition||'ปกติ'); }
  else if(m==='status') ln.value = l.value_text || ({'ปกติ':'มี','หาย':'หาย','ไม่มี':'ไม่มี'})[l.condition] || null;
  else if(m==='score') ln.value = l.qty_found;
  else if(m==='installed') ln.value = l.value_text || (l.condition==='ชำรุด'?'เสีย':l.condition==='ไม่มี'?'ไม่ได้ติดตั้ง':'ใช้ได้');
  else if(m==='pass_fail'){ const v=String(l.value_text||'').toLowerCase();
    ln.value = (v==='pass'||v==='ผ่าน'||v==='ok') ? 'ผ่าน' : (v==='fail'||v==='ไม่ผ่าน'||v==='เสีย') ? 'ไม่ผ่าน' : l.condition ? (l.condition==='ปกติ'?'ผ่าน':'ไม่ผ่าน') : null; }
  else if(m==='gauge') ln.value = l.value_text || (l.condition==='ปกติ'?'green':l.condition==='ชำรุด'?'low':'missing');
  if(it.fm_no){ ln.chips=(l.fail_parts||[]).slice(); ln.text=l.note||''; } else splitNote(l.note, ln);
  if(l.photo_url){ ln.photo=l.photo_url; ln.photoUp='ok'; }
  if(forEdit && l.admin_note){ ln.admin=l.admin_note; ln.touched=false; ln.open=true; }
  return ln;
}
// gauge ที่ต้องมีหลายถัง → แยกการ์ด "ถังที่ 1/2" แต่ละถังมีเกจ+รูปของตัวเอง · ส่งกลับเป็น item_code เดิม + unit_no
const UNIT_SEP='__';
const MULTI = {};   // item_code ที่แยกเป็นหลายถัง
const unitsOf = it => it.check_mode==='gauge' ? (+it.units || +it.qty_expected || 1) : 1;
function expandItems(items){
  const out=[];
  (items||[]).forEach(it=>{
    if(it.fm_no) it=Object.assign({}, it, {category:'FM-'+(it.fm_section||'ก')});   // FM-TR-10 แยกหมวด ก/ข/ค ตามเอกสาร
    const nu=unitsOf(it);
    if(it.unit_no || nu<=1){ out.push(it); return; }
    MULTI[it.item_code]=true;
    for(let n=1;n<=nu;n++){
      const pu=(it.prev_units||[]).find(p=>p.unit_no===n) || null;
      out.push(Object.assign({}, it, {item_code:it.item_code+UNIT_SEP+n, base_code:it.item_code, unit_no:n, qty_expected:1,
        name:it.name+' · ถังที่ '+n, sort:it.sort+n/100, prev:pu, prev_units:undefined}));
    }
  });
  return out;
}
// unit_no ตามสัญญา: รายการทั่วไป = 1 เสมอ → แยกคีย์เฉพาะรายการที่แตกเป็นหลายถัง
const lineKey = l => (l.unit_no && MULTI[l.item_code]) ? l.item_code+UNIT_SEP+l.unit_no : l.item_code;
const baseCode = code => String(code).split(UNIT_SEP)[0];
const unitNo = code => { const p=String(code).split(UNIT_SEP); return p[1]?+p[1]:null; };
const prevLine = it => Object.assign({qty_found:null, condition:null, value_text:null, note:null, photo_url:null}, it.prev||{});
function prevProblem(it){
  if(!it.prev || (!it.prev.condition && !it.prev.value_text)) return false;
  const ln=lineFromSaved(it, prevLine(it), false); const inf=lineInfo(it, ln);
  return inf.answered && inf.problem;
}

function noteOf(ln){ return ln.chips.concat(ln.text.trim()?[ln.text.trim()]:[]).join(' · '); }

/* ---------- ประเมินแต่ละรายการ ---------- */
function lineInfo(it, ln){
  const q=it.qty_expected, u=it.unit, m=it.check_mode;
  const r={answered:false, problem:false, tone:'none', label:'ยังไม่เช็ค', ico:'', needPhoto:false, needNote:false, chipSet:null};
  if(m==='count'){
    if(ln.found!=null){
      r.answered=true; const cond=ln.cond||'ปกติ', short=ln.found<q;
      if(cond==='ชำรุด') Object.assign(r,{problem:true,tone:'warn',ico:'🔧',label:'ชำรุด · มี '+ln.found+'/'+q+' '+u,needPhoto:true,needNote:true,chipSet:'broken'});
      else if(cond==='หาย'||short){ const miss=Math.max(q-ln.found,0);
        Object.assign(r,{problem:true,tone:'bad',ico:'❌',label:(miss?'ขาด '+miss+' '+u:'แจ้งหาย')+' · มี '+ln.found+'/'+q,needPhoto:REQUIRE_PHOTO_ON_LOST,needNote:true,chipSet:'lost'}); }
      else if(ln.found>q) Object.assign(r,{tone:'ok',ico:'✅',label:'มี '+ln.found+' '+u+' (เกิน '+(ln.found-q)+')'});
      else Object.assign(r,{tone:'ok',ico:'✅',label:'ครบ '+q+' '+u});
    }
  } else if(m==='status'){
    if(ln.value){ r.answered=true;
      if(ln.value==='ไม่มี') Object.assign(r,{problem:true,tone:'bad',ico:'➖',label:'ไม่มี',needNote:true,chipSet:'none'});
      else if(ln.value==='หาย') Object.assign(r,{problem:true,tone:'bad',ico:'❌',label:'หาย',needPhoto:REQUIRE_PHOTO_ON_LOST,needNote:true,chipSet:'lost'});
      else Object.assign(r,{tone:'ok',ico:'✅',label:ln.value==='มี'?'มี (อยู่กับตัว)':'อยู่ที่รถ'}); }
  } else if(m==='score'){
    if(ln.value!=null){ const v=+ln.value; r.answered=true;
      Object.assign(r,{tone:v>=7?'ok':v>=5?'warn':'bad',ico:v>=7?'✨':'🧽',label:v+' / 10 คะแนน'}); }
  } else if(m==='installed'){
    if(ln.value){ r.answered=true;
      if(ln.value==='เสีย') Object.assign(r,{problem:true,tone:'warn',ico:'🔧',label:'ติดตั้ง แต่เสีย',needPhoto:true,needNote:true,chipSet:'broken'});
      else if(ln.value==='ไม่ได้ติดตั้ง') Object.assign(r,{problem:true,tone:'bad',ico:'➖',label:'ไม่มีติดตั้ง',needNote:true,chipSet:'none'});
      else Object.assign(r,{tone:'ok',ico:'✅',label:'ติดตั้ง ใช้ได้'}); }
  } else if(m==='pass_fail' && it.fm_no){
    if(ln.value){ r.answered=true;
      if(ln.value==='ไม่ผ่าน') Object.assign(r,{problem:true,tone:'bad',ico:it.fm_star?'⛔':'👎',label:'ผิดปกติ'+(ln.chips.length?' · '+ln.chips.join(', '):''),needPhoto:REQUIRE_PHOTO_ON_FAIL,chipSet:'fm'});
      else Object.assign(r,{tone:'ok',ico:'👍',label:'ปกติ'}); }
  } else if(m==='pass_fail'){
    if(ln.value){ r.answered=true;
      if(ln.value==='ไม่ผ่าน') Object.assign(r,{problem:true,tone:'bad',ico:'👎',label:'ไม่ผ่าน',needPhoto:REQUIRE_PHOTO_ON_FAIL,needNote:true,chipSet:'fail'});
      else Object.assign(r,{tone:'ok',ico:'👍',label:'ผ่าน'}); }
  }
  else if(m==='gauge'){
    if(ln.value){ r.answered=true;
      if(ln.value==='low') Object.assign(r,{problem:true,tone:'bad',ico:'🔴',label:'เข็มต่ำ (แดงซ้าย)',needPhoto:true,needNote:true,chipSet:'gauge'});
      else if(ln.value==='high') Object.assign(r,{problem:true,tone:'warn',ico:'🟡',label:'เข็มสูงเกิน (แดงขวา)',needPhoto:true,needNote:true,chipSet:'gauge'});
      else if(ln.value==='missing') Object.assign(r,{problem:true,tone:'bad',ico:'❌',label:'ไม่มีถัง / หาย',needNote:true,chipSet:'lost'});
      else Object.assign(r,{tone:'ok',ico:'🟢',label:'เข็มอยู่โซนเขียว'+(it.qty_expected>1?' ('+it.qty_expected+' ถัง)':'')}); }
  }
  // photo_required = ต้องมีรูปทุกครั้ง (เช่น เกจถังดับเพลิง) ยกเว้นตอนไม่มีของให้ถ่าย
  if(r.answered && it.photo_required && !(r.chipSet==='lost'||r.chipSet==='none')) r.needPhoto=true;
  const miss=[];
  if(r.answered){
    if(r.needPhoto && !ln.photo) miss.push('ถ่ายรูป');
    if(r.needNote && !noteOf(ln)) miss.push('เลือกว่าเกิดอะไรขึ้น');
    if(r.chipSet==='fm'){
      const subs=(it.sub_parts||[]).filter(x=>x!==FM_OTHER);
      if(subs.length && !ln.chips.length) miss.push('ติ๊กส่วนที่ผิดปกติ');
      if((!subs.length || ln.chips.indexOf(FM_OTHER)>=0) && !ln.text.trim()) miss.push('พิมพ์อาการ');
    }
  }
  r.canFinish = r.answered && !miss.length;
  if(r.answered && !ln.touched) miss.push('แก้ตามแอดมินแล้วกด "เรียบร้อย"');
  r.missing=miss; r.done=r.answered && !miss.length; return r;
}
function odoInfo(){
  const F=S.F, d=S.data, n=parseInt(F.odo,10), valid=!isNaN(n)&&n>0;
  let warn='';
  if(valid && d.last_odometer){
    if(n<d.last_odometer) warn='⚠️ น้อยกว่าครั้งก่อน ('+fmtNum(d.last_odometer)+') — ดูเลขอีกครั้ง';
    else if(n-d.last_odometer>3000) warn='⚠️ มากกว่าครั้งก่อน '+fmtNum(n-d.last_odometer)+' กม. — ดูเลขอีกครั้ง';
  }
  const miss=[]; if(!valid) miss.push('กรอกเลขไมล์');
  return {valid, n, warn, missing:miss, done:!miss.length};
}

function progress(){

function todayKey(d){
  const c=d.check;
  if(c && c.status==='ต้องแก้ไข') return 'ret';
  if(c && c.status==='ตรวจแล้ว') return 'reviewed';
  if(c) return c.on_time===false ? 'late' : 'ontime';   // null = ไม่รู้เวลาออกรถ → แสดง "✅ ส่งแล้ว"
  const dep=d.departure||{};
  if(dep.ran || d.will_be_late) return 'departed';
  if(d.has_job_today===false) return 'norun';
  return 'todo';
}

// สถิติจาก history ย่อใน myDaily (ใช้ตอน myHistory โหลดไม่ได้)
function statsOf(days){
  const sent=days.filter(x=>x.check_id), on=sent.filter(x=>x.on_time===true).length, late=sent.filter(x=>x.on_time===false).length;
  const missed=days.filter(x=>x.code==='miss').length;
  return {known_days:on+late+missed, sent:sent.length, on_time:on, late, unknown:sent.length-on-late, missed};
}
// กันซ้ำฝั่งหน้าเว็บ: ก่อนวันเริ่มนับ 🔴 → none
const dayCode = x => (x.code==='miss' && x.date<startDate()) ? 'none' : x.code;
async function loadHist(){
  const el=$('hist'); if(!el) return;
  let h=S.hist;
  if(!h){
    const to=addDays(S.date,-1), from=addDays(S.date,-14);
    try{ h=await api.getMyHistory({vehicleId:S.data.vehicle.id, from, to}); if(!h||!h.ok) throw new Error('hist'); }
    catch(e){ const days=(S.data.history||[]).filter(x=>x.date<S.date); h = days.length ? {days, stats:statsOf(days)} : null; }
    S.hist=h;
  }
  if(!$('hist') || S.screen!=='home') return;
  if(!h){ $('hist').innerHTML='<div class="muted small" style="margin:0 4px">ต่อเน็ตไม่ได้ — ดูย้อนหลังไม่ได้ตอนนี้</div>'; return; }
  const days=h.days.filter(x=>x.date<S.date).sort((a,b)=>a.date<b.date?-1:1).slice(-14).map(x=>Object.assign({},x,{code:dayCode(x)}));   // เก่า → ใหม่ (ซ้าย → ขวา)
  const sm=Object.assign(statsOf(days), h.stats||{});
  if(sm.known_days==null) sm.known_days=statsOf(days).known_days;
  sm.missed=days.filter(x=>x.code==='miss').length;
  $('hist').innerHTML=
    '<div class="stat"><div><b style="color:var(--ok)">'+sm.on_time+'/'+sm.known_days+'</b><span>ส่งก่อนออกรถ<br>(วันที่รู้เวลาออกรถ)</span></div>'+
    '<div><b style="color:#A16207">'+sm.late+'</b><span>ส่งหลังออกรถ</span></div><div><b style="color:var(--bad)">'+sm.missed+'</b><span>วิ่งแต่ไม่ส่ง</span></div></div>'+
    '<div class="days">'+days.map(x=>{ const dd=parseD(x.date);
      return '<button class="day d-'+x.code+'" onclick="A.openDay(\''+x.date+'\')" aria-label="'+dayLabel(x.date,true)+'"><small>'+TH_WS[dd.getDay()]+'</small><b>'+dd.getDate()+'</b><i>'+(DAY_IC[x.code]||x.emoji||'·')+'</i></button>'; }).join('')+'</div>'+
    '<div class="legend"><span>✅ ก่อนออกรถ</span><span>🟡 หลังออกรถ</span><span>⚠️ มีของขาด/ชำรุด</span><span>🔴 ไม่ส่ง</span><span>➖ ไม่วิ่ง</span><span>· ยังไม่เริ่มนับ</span></div>';
}

function isFreshCapture(file){ if(!file || !file.lastModified) return true; return (Date.now()-file.lastModified) <= MAX_PHOTO_AGE_MS; }
async function exifTakenAt(file){
  try{
    const b=new DataView(await file.slice(0,256*1024).arrayBuffer());
    if(b.getUint16(0)!==0xFFD8) return null;
    let p=2;
    while(p+4<b.byteLength){
      const mk=b.getUint16(p), len=b.getUint16(p+2);
      if(mk===0xFFE1 && b.getUint32(p+4)===0x45786966){
        const T=p+10, le=b.getUint16(T)===0x4949;
        const u16=o=>b.getUint16(T+o,le), u32=o=>b.getUint32(T+o,le);
        const str=(o,n)=>{let s='';for(let i=0;i<n-1;i++)s+=String.fromCharCode(b.getUint8(T+o+i));return s;};
        const scan=(ifd,want)=>{const n=u16(ifd);const out={};for(let i=0;i<n;i++){const e=ifd+2+i*12,tag=u16(e);if(want.indexOf(tag)>=0)out[tag]=tag===0x8769?u32(e+8):str(u32(e+8),u32(e+4));}return out;};
        const a=scan(u32(4),[0x0132,0x8769]); const ex=a[0x8769]?scan(a[0x8769],[0x9003]):{};
        const s=ex[0x9003]||a[0x0132]; const m=s&&s.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        return m?new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]):null;
      }
      if((mk&0xFF00)!==0xFF00) return null;
      p+=2+len;
    }
  }catch(e){}
  return null;
}
function resizeToDataURL(file, maxDim, quality){
  return new Promise(resolve=>{
    try{
      const url=URL.createObjectURL(file), img=new Image();
      img.onload=()=>{ try{
        let w=img.naturalWidth, h=img.naturalHeight; const sc=Math.min(1,maxDim/Math.max(w,h));
        w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const x=cv.getContext('2d');
        x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url); resolve(cv.toDataURL('image/jpeg',quality));
      }catch(e){ URL.revokeObjectURL(url); resolve(null); } };
      img.onerror=()=>{ URL.revokeObjectURL(url); resolve(null); };
      img.src=url;
    }catch(e){ resolve(null); }
  });
}

  if(!isFreshCapture(file)){ toast('กรุณา "ถ่ายรูปสด" ด้วยกล้องเท่านั้น\nห้ามเลือกรูปเก่าจากคลังภาพ','warn',5000); return; }
  const taken=await exifTakenAt(file);
  if(taken && Date.now()-taken.getTime()>MAX_EXIF_AGE_MS){ toast('รูปนี้ถ่ายไว้ตั้งแต่ '+fmtDT(taken.toISOString())+'\nไม่ใช่รูปปัจจุบัน — ถ่ายใหม่ตอนนี้','warn',6000); return; }
  const b64=await resizeToDataURL(file,1280,0.7);
  if(!b64){ toast('อ่านรูปไม่ได้ ลองถ่ายใหม่','error'); return; }
  gotPhoto(target,b64);
});
function upParams(k, b64){
  const p={vehicleId:S.data.vehicle.id, date:S.date, kind:k.kind, itemCode:k.itemCode?baseCode(k.itemCode):'', imageBase64:b64};
  if(k.itemCode) p.unitNo=unitNo(k.itemCode)||1;
  return p;
}
function tgtKind(t){ if(t==='__ODO__') return {kind:'odometer'}; const m=/^__OV(\d)__$/.exec(t); if(m) return {kind:'overview', slot:+m[1]}; return {kind:'line', itemCode:t}; }
function setPhoto(target, src, up){
  const F=S.F, k=tgtKind(target);
  if(k.kind==='odometer'){ F.odoPhoto=src; F.odoUp=up; }
  else if(k.kind==='overview') F.ov[k.slot]= src?{src,up}:null;
  else { const ln=F.lines[target]; ln.photo=src; ln.photoUp=up; ln.same=false; }
}
async function gotPhoto(target, b64){
  const k=tgtKind(target);
  setPhoto(target,b64,'uploading');
  if(k.kind==='line'){   // รายการที่ต้องถ่ายรูปทุกครั้ง (เกจ) + ปกติ → ได้รูปแล้วพับเก็บเอง
    const it=itemByCode(target), ln=S.F.lines[target], inf=lineInfo(it,ln);
    if(inf.done && !inf.problem && !ln.admin) ln.open=false;
  }
  repaintTarget(target); saveDraft();
  try{
    const r=await api.uploadPhoto(upParams(k, b64));
    if(!r||!r.ok) throw new Error(r&&r.error||'upload');
    setPhoto(target,r.url,'ok');
  }catch(e){ setPhoto(target,b64,'local'); }
  repaintTarget(target); saveDraft();
}
function repaintTarget(target){
  if(S.screen!=='check' || !S.F) return;
  const k=tgtKind(target);
  if(k.kind==='odometer'){ const c=$('odo-card'); if(c) c.innerHTML=odoCardHTML(); refreshProg(); }
  else if(k.kind==='overview'){ const c=$('ov-card'); if(c) c.innerHTML=ovCardHTML(); refreshProg(); }
  else rerenderItem(target);
}

function buildPayload(){
  const d=S.data, F=S.F; let clean=null;
  const lines=d.items.map(it=>{
    const ln=F.lines[it.item_code], m=it.check_mode, note=noteOf(ln)||null, photo_url=ln.photo||null, base={item_code:it.base_code||it.item_code, photo_url, note};
    if(it.unit_no) base.unit_no=it.unit_no;   // ถังที่ n (รายการอื่นไม่ส่ง = 1)
    if(m==='count') return Object.assign(base,{qty_expected:it.qty_expected, qty_found:ln.found, condition:ln.cond||'ปกติ', value_text:null});
    if(m==='status'){ const c={'มี':'ปกติ','อยู่ที่รถ':'ปกติ','ไม่มี':'ไม่มี','หาย':'หาย'}[ln.value];
      return Object.assign(base,{qty_expected:1, qty_found:c==='ปกติ'?1:0, condition:c, value_text:ln.value}); }
    if(m==='score'){ clean=+ln.value; return Object.assign(base,{qty_expected:10, qty_found:+ln.value, condition:'ปกติ', value_text:String(ln.value)}); }
    // gauge: ส่ง value_text อย่างเดียว ระบบแปลง condition เอง · ไม่เขียว = ชำรุด → ระบบตั้ง first_damage_date เอง ไม่ถามคนขับ
    if(m==='gauge') return Object.assign(base,{value_text:ln.value});
    if(m==='pass_fail' && it.fm_no){ const bad=ln.value!=='ผ่าน';
      return Object.assign(base,{value_text:bad?'fail':'pass', note:bad?(ln.text.trim()||null):null, fail_parts:bad?ln.chips.slice():[]}); }
    if(m==='pass_fail') return Object.assign(base,{value_text:ln.value==='ผ่าน'?'pass':'fail'});   // ระบบแปลง condition เอง (pass=ปกติ · fail=ชำรุด)
    const c={'ใช้ได้':'ปกติ','เสีย':'ชำรุด','ไม่ได้ติดตั้ง':'ไม่มี'}[ln.value];
    return Object.assign(base,{qty_expected:1, qty_found:c==='ไม่มี'?0:1, condition:c, value_text:ln.value});
  });
  return {vehicleId:d.vehicle.id, date:S.date, odometer:parseInt(F.odo,10), odometer_photo:F.odoPhoto,
    overview_photos:F.ov.filter(Boolean).map(o=>o.src), cleanliness:clean, note:'', client_draft_id:F.draftId, allOk:false, lines};   // allOk:false = ส่งครบทุกบรรทัดเอง
}

/* toast (แบบ Driver_form + ปุ่มยกเลิก) */
function toast(msg,type,ms,action){
  const wrap=$('toastWrap'), el=document.createElement('div'); el.className='toast '+(type||'info');
  el.innerHTML='<span>'+(({ok:'✅',error:'❌',warn:'⚠️',info:'ℹ️'})[type]||'ℹ️')+'</span><span class="tx"></span>'; el.querySelector('.tx').textContent=msg;
  if(action){ const b=document.createElement('button'); b.className='ta'; b.textContent=action.label; b.onclick=e=>{ e.stopPropagation(); action.fn(); el.remove(); }; el.appendChild(b); }
  el.onclick=()=>el.remove(); wrap.appendChild(el);
  setTimeout(()=>el.remove(), ms||(type==='error'?4200:2800));
}

// PHOTO_REQUIRED: missing = ไม่มีรูป · stale = รูปไม่ใช่ของวันนี้ → ล้างรูปให้ถ่ายใหม่
function photoRequired(res){
  const nameOf=k=>{ if(k==='overview') return 'รูปรวม'; if(k==='odometer') return 'รูปหน้าปัดเลขไมล์';
    const [c,n]=String(k).split('#'); const key=n&&MULTI[c]?c+UNIT_SEP+n:c; const it=itemByCode(key); return it?it.name:k; };
  const keyOf=k=>{ const [c,n]=String(k).split('#'); return n&&MULTI[c]?c+UNIT_SEP+n:c; };
  const miss=(res.missing||[]), stale=(res.stale||[]);
  stale.concat(miss).forEach(k=>{
    if(k==='overview'){ if(stale.indexOf(k)>=0) S.F.ov=[null,null]; return; }
    if(k==='odometer'){ S.F.odoPhoto=null; S.F.odoUp=null; return; }
    const ln=S.F.lines[keyOf(k)]; if(ln){ ln.photo=null; ln.photoUp=null; ln.open=true; ln.touched=true; }
  });
  saveDraft(true);
  const msg=(stale.length?'ต้องถ่ายรูปใหม่วันนี้ (ห้ามใช้รูปวันก่อน):\n'+stale.map(nameOf).join(', ')+'\n':'')+(miss.length?'ยังไม่มีรูป: '+miss.map(nameOf).join(', '):'');
  toast(msg.trim()||(res.error||'ต้องมีรูป'),'error',7000);
  go('check',{},true); setTimeout(()=>A.nextTodo(),120);
}
function updateOnline(){ $('offline-bar').classList.toggle('hide', navigator.onLine); }
window.addEventListener('online', updateOnline); window.addEventListener('offline', updateOnline);

/* =====================================================================
   boot
   ===================================================================== */
async function loadData(replace){
  const cacheKey='ssb_veq_cache2_'+(S.user.mode==='link' ? 'link' : S.user.userId);
  S.date=isoDate(new Date());
  S.screen='loading'; render();
  let d;
  try{ d=await api.getMyDaily({date:S.date}); S.stale=false; if(d && d.ok) lsSet(cacheKey, JSON.stringify(d)); }
  catch(e){
    if(S.expired) return;
    try{ d=JSON.parse(lsGet(cacheKey)||'null'); }catch(_){ d=null; }
    if(d && d.date===S.date) S.stale=true; else { S.data=null; go('error',{},replace); return; }
  }
  if(S.expired || (d && d.code==='LINK_EXPIRED')) return;
  if(d && d.ok){ d.items_raw=d.items||[]; d.items=expandItems(d.items_raw); }
  S.data=d;
  S.uid = S.user.mode==='link' ? 'D_'+((d&&d.driver&&d.driver.driver_id)||'x') : S.user.userId;
  if(!d || !d.ok){ const c=d&&d.code; go(c==='NO_VEHICLE'?'novehicle':c==='NOT_DRIVER'?'notdriver':c==='INACTIVE'?'inactive':c==='NOT_YOUR_VEHICLE'?'notyours':'error',{msg:d&&d.error||''},replace); return; }
  // คีย์ร่างในเครื่อง: LIFF = userId · ลิงก์ = รหัสคนขับ (t เปลี่ยนทุกวัน ไม่ใช้เป็นคีย์)
  S.uid = S.user.mode==='link' ? 'D_'+((d.driver&&d.driver.driver_id)||'x') : S.user.userId;
  go('home',{},replace);
  // เปิดจากปุ่มการ์ด "ช" (?src=kw) → เข้าหน้าวันนี้ทันที (ครั้งแรกที่โหลดเท่านั้น · กดย้อนกลับ = หน้าแรก)
  if(S.entry==='kw'){
    S.entry=null; const k=todayKey(d);
    if(k==='todo'||k==='departed'||k==='ret') A.start();
    else if(k==='ontime'||k==='late'||k==='reviewed') A.viewCurrent();
    // norun = อยู่หน้าแรก ("วันนี้ไม่มีงาน ไม่ต้องส่ง")
  }
}
S.entry=qp('src');
async function boot(){
  S.screen='loading'; render(); updateOnline();
  if(S.expired){ go('expired',{},true); return; }
  if(!S.user){ S.user=await auth.getUser(); }
  if(!S.user){ go('outside',{},true); return; }
  await loadData(true);
}
boot();
